name: semiconductor-yield-rca

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yield_rca}
      POSTGRES_USER: ${POSTGRES_USER:-yield_rca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: ${YIELD_RCA_BACKEND_TARGET:-runtime}
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      YIELD_RCA_DATABASE_URL: postgresql://${POSTGRES_USER:-yield_rca}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-yield_rca}
      YIELD_RCA_DATASET: ${YIELD_RCA_DATASET:-multi_case}
      YIELD_RCA_AGENT_MODE: ${YIELD_RCA_AGENT_MODE:-deterministic}
      YIELD_RCA_ORCHESTRATION_MODE: ${YIELD_RCA_ORCHESTRATION_MODE:-fixed}
      YIELD_RCA_LLM_PROVIDER: ${YIELD_RCA_LLM_PROVIDER:-dashscope}
      YIELD_RCA_LLM_MODEL: ${YIELD_RCA_LLM_MODEL:-qwen-plus}
      YIELD_RCA_LLM_BASE_URL: ${YIELD_RCA_LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      YIELD_RCA_LLM_TIMEOUT_SECONDS: ${YIELD_RCA_LLM_TIMEOUT_SECONDS:-60}
      YIELD_RCA_LLM_MAX_RETRIES: ${YIELD_RCA_LLM_MAX_RETRIES:-1}
      YIELD_RCA_KNOWLEDGE_RETRIEVER_MODE: ${YIELD_RCA_KNOWLEDGE_RETRIEVER_MODE:-keyword}
      YIELD_RCA_KNOWLEDGE_EMBEDDING_MODEL: ${YIELD_RCA_KNOWLEDGE_EMBEDDING_MODEL:-BAAI/bge-m3}
      YIELD_RCA_KNOWLEDGE_EMBEDDING_REVISION: ${YIELD_RCA_KNOWLEDGE_EMBEDDING_REVISION:-5617a9f61b028005a4858fdac845db406aefb181}
      YIELD_RCA_KNOWLEDGE_EMBEDDING_DEVICE: ${YIELD_RCA_KNOWLEDGE_EMBEDDING_DEVICE:-auto}
      YIELD_RCA_KNOWLEDGE_EMBEDDING_BATCH_SIZE: ${YIELD_RCA_KNOWLEDGE_EMBEDDING_BATCH_SIZE:-32}
      YIELD_RCA_KNOWLEDGE_RERANKER_ENABLED: ${YIELD_RCA_KNOWLEDGE_RERANKER_ENABLED:-0}
      YIELD_RCA_KNOWLEDGE_RERANKER_MODEL: ${YIELD_RCA_KNOWLEDGE_RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      YIELD_RCA_KNOWLEDGE_RERANKER_REVISION: ${YIELD_RCA_KNOWLEDGE_RERANKER_REVISION:-953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e}
      YIELD_RCA_KNOWLEDGE_RERANKER_DEVICE: ${YIELD_RCA_KNOWLEDGE_RERANKER_DEVICE:-auto}
      YIELD_RCA_KNOWLEDGE_RERANKER_BATCH_SIZE: ${YIELD_RCA_KNOWLEDGE_RERANKER_BATCH_SIZE:-16}
      YIELD_RCA_KNOWLEDGE_RERANKER_CANDIDATE_K: ${YIELD_RCA_KNOWLEDGE_RERANKER_CANDIDATE_K:-20}
      YIELD_RCA_KNOWLEDGE_RERANKER_LOCAL_PATH: ${YIELD_RCA_KNOWLEDGE_RERANKER_LOCAL_PATH:-}
      YIELD_RCA_KNOWLEDGE_CALIBRATION_ARTIFACT: ${YIELD_RCA_KNOWLEDGE_CALIBRATION_ARTIFACT:-}
      YIELD_RCA_CAUSAL_SCOPE_ENABLED: ${YIELD_RCA_CAUSAL_SCOPE_ENABLED:-1}
      YIELD_RCA_CAUSAL_SCOPE_CANDIDATE_BUDGET: ${YIELD_RCA_CAUSAL_SCOPE_CANDIDATE_BUDGET:-20}
      YIELD_RCA_CAUSAL_SCOPE_LANE_MINIMUM: ${YIELD_RCA_CAUSAL_SCOPE_LANE_MINIMUM:-1}
      HF_HOME: /var/cache/huggingface
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    volumes:
      - model_cache:/var/cache/huggingface
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: ${YIELD_RCA_WORKER_TARGET:-worker}
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      YIELD_RCA_DATABASE_URL: postgresql://${POSTGRES_USER:-yield_rca}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-yield_rca}
      YIELD_RCA_DATASET: ${YIELD_RCA_DATASET:-multi_case}
      YIELD_RCA_AGENT_MODE: ${YIELD_RCA_AGENT_MODE:-deterministic}
      YIELD_RCA_ORCHESTRATION_MODE: ${YIELD_RCA_ORCHESTRATION_MODE:-fixed}
      YIELD_RCA_LLM_PROVIDER: ${YIELD_RCA_LLM_PROVIDER:-dashscope}
      YIELD_RCA_LLM_MODEL: ${YIELD_RCA_LLM_MODEL:-qwen-plus}
      YIELD_RCA_LLM_BASE_URL: ${YIELD_RCA_LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      YIELD_RCA_LLM_TIMEOUT_SECONDS: ${YIELD_RCA_LLM_TIMEOUT_SECONDS:-60}
      YIELD_RCA_LLM_MAX_RETRIES: ${YIELD_RCA_LLM_MAX_RETRIES:-1}
      YIELD_RCA_WORKER_LEASE_SECONDS: ${YIELD_RCA_WORKER_LEASE_SECONDS:-180}
      YIELD_RCA_WORKER_HEARTBEAT_SECONDS: ${YIELD_RCA_WORKER_HEARTBEAT_SECONDS:-30}
      YIELD_RCA_WORKER_POLL_SECONDS: ${YIELD_RCA_WORKER_POLL_SECONDS:-1}
      YIELD_RCA_WORKER_RECOVERY_SECONDS: ${YIELD_RCA_WORKER_RECOVERY_SECONDS:-30}
      YIELD_RCA_WORKER_RETRY_BASE_SECONDS: ${YIELD_RCA_WORKER_RETRY_BASE_SECONDS:-5}
      YIELD_RCA_KNOWLEDGE_RETRIEVER_MODE: ${YIELD_RCA_KNOWLEDGE_RETRIEVER_MODE:-keyword}
      YIELD_RCA_KNOWLEDGE_EMBEDDING_MODEL: ${YIELD_RCA_KNOWLEDGE_EMBEDDING_MODEL:-BAAI/bge-m3}
      YIELD_RCA_KNOWLEDGE_EMBEDDING_REVISION: ${YIELD_RCA_KNOWLEDGE_EMBEDDING_REVISION:-5617a9f61b028005a4858fdac845db406aefb181}
      YIELD_RCA_KNOWLEDGE_EMBEDDING_DEVICE: ${YIELD_RCA_KNOWLEDGE_EMBEDDING_DEVICE:-auto}
      YIELD_RCA_KNOWLEDGE_EMBEDDING_BATCH_SIZE: ${YIELD_RCA_KNOWLEDGE_EMBEDDING_BATCH_SIZE:-32}
      YIELD_RCA_KNOWLEDGE_RERANKER_ENABLED: ${YIELD_RCA_KNOWLEDGE_RERANKER_ENABLED:-0}
      YIELD_RCA_KNOWLEDGE_RERANKER_MODEL: ${YIELD_RCA_KNOWLEDGE_RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      YIELD_RCA_KNOWLEDGE_RERANKER_REVISION: ${YIELD_RCA_KNOWLEDGE_RERANKER_REVISION:-953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e}
      YIELD_RCA_KNOWLEDGE_RERANKER_DEVICE: ${YIELD_RCA_KNOWLEDGE_RERANKER_DEVICE:-auto}
      YIELD_RCA_KNOWLEDGE_RERANKER_BATCH_SIZE: ${YIELD_RCA_KNOWLEDGE_RERANKER_BATCH_SIZE:-16}
      YIELD_RCA_KNOWLEDGE_RERANKER_CANDIDATE_K: ${YIELD_RCA_KNOWLEDGE_RERANKER_CANDIDATE_K:-20}
      YIELD_RCA_KNOWLEDGE_RERANKER_LOCAL_PATH: ${YIELD_RCA_KNOWLEDGE_RERANKER_LOCAL_PATH:-}
      YIELD_RCA_KNOWLEDGE_CALIBRATION_ARTIFACT: ${YIELD_RCA_KNOWLEDGE_CALIBRATION_ARTIFACT:-}
      YIELD_RCA_CAUSAL_SCOPE_ENABLED: ${YIELD_RCA_CAUSAL_SCOPE_ENABLED:-1}
      YIELD_RCA_CAUSAL_SCOPE_CANDIDATE_BUDGET: ${YIELD_RCA_CAUSAL_SCOPE_CANDIDATE_BUDGET:-20}
      YIELD_RCA_CAUSAL_SCOPE_LANE_MINIMUM: ${YIELD_RCA_CAUSAL_SCOPE_LANE_MINIMUM:-1}
      HF_HOME: /var/cache/huggingface
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    volumes:
      - model_cache:/var/cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/healthz]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  seed:
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: seed
    environment:
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-yield_rca}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-yield_rca}
    command:
      - --seed-dir
      - /app/data/seeds/${YIELD_RCA_DATASET:-multi_case}
      - --reset-schema
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  knowledge-index:
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: knowledge-index
    environment:
      YIELD_RCA_DATABASE_URL: postgresql://${POSTGRES_USER:-yield_rca}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-yield_rca}
      HF_HOME: /var/cache/huggingface
    volumes:
      - model_cache:/var/cache/huggingface
    command:
      - --model
      - ${YIELD_RCA_KNOWLEDGE_EMBEDDING_MODEL:-BAAI/bge-m3}
      - --revision
      - ${YIELD_RCA_KNOWLEDGE_EMBEDDING_REVISION:-5617a9f61b028005a4858fdac845db406aefb181}
      - --device
      - ${YIELD_RCA_KNOWLEDGE_EMBEDDING_DEVICE:-auto}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  model_cache:
