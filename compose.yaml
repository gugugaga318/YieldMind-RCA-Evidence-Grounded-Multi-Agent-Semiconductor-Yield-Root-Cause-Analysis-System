name: semiconductor-yield-rca

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yield_rca}
      POSTGRES_USER: ${POSTGRES_USER:-yield_rca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: runtime
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      YIELD_RCA_DATABASE_URL: postgresql://${POSTGRES_USER:-yield_rca}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-yield_rca}
      YIELD_RCA_DATASET: ${YIELD_RCA_DATASET:-multi_case}
      YIELD_RCA_AGENT_MODE: ${YIELD_RCA_AGENT_MODE:-deterministic}
      YIELD_RCA_LLM_PROVIDER: ${YIELD_RCA_LLM_PROVIDER:-dashscope}
      YIELD_RCA_LLM_MODEL: ${YIELD_RCA_LLM_MODEL:-qwen-plus}
      YIELD_RCA_LLM_BASE_URL: ${YIELD_RCA_LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      YIELD_RCA_LLM_TIMEOUT_SECONDS: ${YIELD_RCA_LLM_TIMEOUT_SECONDS:-60}
      YIELD_RCA_LLM_MAX_RETRIES: ${YIELD_RCA_LLM_MAX_RETRIES:-1}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/healthz]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  seed:
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: seed
    environment:
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-yield_rca}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-yield_rca}
    command:
      - --seed-dir
      - /app/data/seeds/${YIELD_RCA_DATASET:-multi_case}
      - --reset-schema
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
